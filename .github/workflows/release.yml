name: Release

# Tag-triggered macOS (Apple Silicon) release. Builds the self-contained .app/.dmg and
# attaches it to a GitHub Release. Signing + notarization are CONDITIONAL: they run only
# when the Apple secrets are configured (see below), otherwise the build is UNSIGNED
# (the app already ships with a documented right-click -> Open Gatekeeper step). Because
# this is tag/dispatch-triggered, it never gates normal PRs.
#
# workflow_dispatch = an unsigned dry-run of the whole pipeline (no tag, no secrets needed).
#
# Owner secrets to enable a SIGNED + NOTARIZED release (Repo Settings -> Secrets -> Actions):
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  the .p12 export password
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                    your Apple ID (for notarytool)
#   APPLE_PASSWORD              an app-specific password for that Apple ID
#   APPLE_TEAM_ID               your 10-char Apple Developer Team ID
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write   # create the Release + upload assets

env:
  # Pinned, not a range. `cargo install tauri-cli --version "^2.0"` resolves at RUN
  # time, so two releases can embed different bundlers with nothing in the repo
  # changing — v1.1.0 and v1.1.1 both happened to land on 2.11.4, one day apart, so
  # this is a hole that has not bitten yet rather than a bug being fixed.
  #
  # Pinning is also what makes the cache below correct: the key can be computed
  # BEFORE the install, instead of reading the version back out of the binary the
  # install just produced.
  #
  # Bumping: change this one value (both legs read it). Check the tauri-cli
  # changelog for bundler behaviour first — this is the thing that builds the
  # .dmg/.exe/.msi, so a surprise here surfaces as a broken installer, not a red CI.
  TAURI_CLI_VERSION: "2.11.4"

jobs:
  release:
    runs-on: macos-latest   # Apple Silicon — assemble-backend.sh bundles an aarch64-apple-darwin Python
    steps:
      - uses: actions/checkout@v7

      - name: Validate Apple signing config (all-or-nothing)
        id: signcfg
        # secrets aren't readable in a step-level `if:`, so read all six here and decide the
        # signing mode ONCE. Fail fast on a PARTIAL config — otherwise a missing signing
        # identity would codesign with "" (hard fail), or a missing APPLE_CERTIFICATE with the
        # rest set would silently fall through to an ad-hoc/unsigned release when signing was
        # intended. Outputs: signing = full | none (partial exits non-zero).
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -u
          missing=""; present=0
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; else present=$((present + 1)); fi
          done
          if [ "$present" -eq 0 ]; then
            echo "signing=none" >> "$GITHUB_OUTPUT"
            echo "No Apple secrets set -> building UNSIGNED (ad-hoc)."
          elif [ -n "$missing" ]; then
            echo "::error::Incomplete Apple signing config: $present/6 secrets set, missing:$missing. Set ALL six APPLE_* secrets to sign+notarize, or NONE to build unsigned."
            exit 1
          else
            echo "signing=full" >> "$GITHUB_OUTPUT"
            echo "All six Apple secrets present -> building SIGNED + NOTARIZED."
          fi

      - name: Resolve version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")+dryrun"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building arkiv $V"

      - name: Stamp version from tag (so the bundle can't drift from the tag)
        if: ${{ github.ref_type == 'tag' }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          python3 - "$V" <<'PY'
          import json, re, sys, pathlib
          v = sys.argv[1]
          p = pathlib.Path("src-tauri/tauri.conf.json"); d = json.loads(p.read_text()); d["version"] = v
          p.write_text(json.dumps(d, indent=2) + "\n")
          c = pathlib.Path("src-tauri/Cargo.toml"); t = c.read_text()
          c.write_text(re.sub(r'(?m)^version = ".*"$', f'version = "{v}"', t, count=1))
          PY

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (SPA that assemble-backend + generate_context! embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Build .venv (assemble-backend needs .venv/lib/python3.12/site-packages)
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements.txt -c constraints.txt

      - name: Assemble self-contained backend bundle
        run: bash src-tauri/assemble-backend.sh

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"  # = rust-toolchain.toml (tests/test_toolchain_pins.py)

      # -- tauri-cli: download the official prebuilt BINARY, don't compile it --
      # `cargo install tauri-cli` compiles the CLI from source: 9m38s (macOS) and
      # 10m05s (Windows) on the v1.1.1 tag run (32446240446); still 3m20s / 9m14s
      # on v1.5.1 (38526072411).
      #
      # #345 tried to fix that with actions/cache. It never hit on a release, and
      # it CANNOT: v1.5.1 logged `Cache not found for input keys:
      # tauri-cli-macOS-2.11.4` while that exact key already existed, saved three
      # hours earlier by v1.5.0 -- under ref `refs/tags/v1.5.0`. A tag run can only
      # restore caches from its own tag or the default branch, so each release
      # wrote a cache only that same tag could ever read. Priming from main would
      # not hold either: releases are weeks apart, GitHub evicts entries unused
      # for 7 days, and this repo sits above its 10 GB cache quota (rust-cache
      # entries are ~300-450 MB each), so LRU eviction is constant.
      #
      # So: no cache. tauri-apps publishes the CLI as a release asset for each
      # target (the same files `cargo binstall` would fetch). Pinned by version
      # (TAURI_CLI_VERSION above) AND by sha256, so a bump has to touch the hash
      # here too -- a mismatch fails the step instead of shipping an unknown
      # bundler. Hashes = the `digest` GitHub reports for each asset:
      #   gh api repos/tauri-apps/tauri/releases/tags/tauri-cli-v<VER> \
      #     -q '.assets[]|[.name,.digest]|@tsv'
      # Not `cargo binstall`: its metadata for aarch64-apple-darwin says .tgz while
      # the asset is a .zip, so on this Mac leg it would fall back to compiling.
      - name: Install tauri-cli (prebuilt, sha256-pinned)
        shell: bash
        env:
          TAURI_CLI_TARGET: aarch64-apple-darwin
          TAURI_CLI_SHA256: 82bdcb9ae7f407882321680ae50750f11623fae22445f8b00b096e10f815d604
        run: |
          set -euo pipefail
          url="https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/cargo-tauri-${TAURI_CLI_TARGET}.zip"
          zip="$RUNNER_TEMP/cargo-tauri.zip"
          curl -fsSL --retry 3 --retry-all-errors -o "$zip" "$url"
          echo "${TAURI_CLI_SHA256}  $zip" | shasum -a 256 -c -
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$bin"
          unzip -o -j "$zip" cargo-tauri -d "$bin"
          chmod +x "$bin/cargo-tauri"

      # Prove the binary runs and is the pinned version (a wrong-arch or wrong-
      # version file would otherwise surface much later as a confusing bundler
      # failure). It also prints the version into the log so a future "which
      # bundler built this installer?" is answerable from the run.
      - name: Verify tauri-cli
        shell: bash
        run: |
          v="$(cargo tauri --version | tr -d '\r')"
          echo "$v"
          [ "$v" = "tauri-cli ${TAURI_CLI_VERSION}" ] || { echo "::error::expected tauri-cli ${TAURI_CLI_VERSION}, got '$v'"; exit 1; }

      - name: Import Apple signing cert (only when configured)
        if: steps.signcfg.outputs.signing == 'full'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # Two build paths — signed vs ad-hoc — because an EMPTY APPLE_SIGNING_IDENTITY is a trap:
      # Tauri codesigns with "" -> `codesign --sign ""` -> "no identity found" -> bundle fails.
      # And an arm64 binary MUST be at least ad-hoc signed to exec at all, so the no-secrets
      # path uses "-" (ad-hoc) rather than leaving the identity unset/empty.
      - name: Build signed + notarized app (Apple secrets present)
        if: steps.signcfg.outputs.signing == 'full'
        env:
          CI: "true"   # skips the Finder AppleScript so the .dmg builds headless (assemble-backend.sh:72-76)
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo tauri build

      - name: Build unsigned app (no Apple secrets — ad-hoc sign so arm64 still launches)
        if: steps.signcfg.outputs.signing == 'none'
        env:
          CI: "true"
          APPLE_SIGNING_IDENTITY: "-"   # ad-hoc; unnotarized (documented right-click->Open on download)
        run: cargo tauri build

      - name: Attach artifacts to the GitHub Release (tag only)
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: false
          # This is the ONLY job that sets `body` — action-gh-release replaces it
          # wholesale, so a second job passing its own would erase this one. The
          # Windows leg attaches files without a body.
          body: |
            arkiv ${{ steps.ver.outputs.version }} — macOS (Apple Silicon) + Windows (x64).

            Both builds are unsigned:
            - **macOS**: right-click -> Open once to clear Gatekeeper (see `docs/quickstart-mac.md`).
            - **Windows**: SmartScreen shows "Windows protected your PC" -> **More info** -> **Run anyway** (see `docs/quickstart-windows.md`).

            The Windows artifacts are attached by a second job and land a few minutes after the macOS ones.

      - name: Upload dry-run artifact (workflow_dispatch)
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/upload-artifact@v7
        with:
          name: arkiv-dryrun-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # ── Windows (x86_64) ─────────────────────────────────────────────────────
  # Mirrors the macOS job above. UNSIGNED for now: there is no Authenticode
  # certificate, so SmartScreen shows a "more info -> run anyway" prompt on
  # first launch, the same shape as the unsigned macOS right-click -> Open step.
  # A conditional signing leg can be added later on the HAS_APPLE_CERT pattern.
  release-windows:
    runs-on: windows-latest
    # Serialized behind the macOS job on purpose. On a tag BOTH legs call
    # action-gh-release against the same Release, and two concurrent
    # create-or-update calls race. This costs wall-clock and buys determinism.
    # The cleaner shape — both legs upload artifacts, a third job publishes once
    # — would mean reworking the already-verified macOS path, so it is a
    # follow-up rather than a prerequisite.
    needs: release
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")+dryrun"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building arkiv $V"

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Stamp version from tag (so the bundle can't drift from the tag)
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          python - "$V" <<'PY'
          import json, re, sys, pathlib
          v = sys.argv[1]
          p = pathlib.Path("src-tauri/tauri.conf.json"); d = json.loads(p.read_text()); d["version"] = v
          p.write_text(json.dumps(d, indent=2) + "\n")
          c = pathlib.Path("src-tauri/Cargo.toml"); t = c.read_text()
          c.write_text(re.sub(r'(?m)^version = ".*"$', f'version = "{v}"', t, count=1))
          PY

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (SPA that assemble-backend-win + generate_context! embed)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # CPU-only torch, installed from the pytorch CPU index BEFORE
      # requirements.txt so silero-vad's torch dependency resolves to the wheel
      # already present. Left to PyPI on a CUDA-capable resolver this is the
      # +cuXXX build — 4.2 GB against ~520 MB, all of it landing in the
      # installer. torch only backs silero VAD; transcription runs on
      # ctranslate2. See the header of assemble-backend-win.ps1.
      - name: Build the packaging venv (.venv-pack)
        shell: pwsh
        # `python`, not `py -3.12`: setup-python puts its interpreter on PATH but
        # does not necessarily register it with the py launcher, so `py -3.12`
        # can resolve to a different (or absent) install on a hosted runner.
        #
        # Every native call is checked: pwsh does NOT stop on a non-zero exit code,
        # and this step used to "succeed" with the CPU-index torch install failing
        # (ResolutionImpossible) — requirements.txt then quietly pulled torch from
        # PyPI instead. The CPU-index install pins only torch's version (read from
        # constraints.txt): the full constraints file names versions of torch's
        # own deps that the CPU index does not carry, which is what made it fail.
        run: |
          function Check($what) { if ($LASTEXITCODE -ne 0) { Write-Error "$what failed (exit $LASTEXITCODE)"; exit 1 } }
          $m = Select-String -Path constraints.txt -Pattern "^torch==([0-9][0-9.]*) ; python_full_version >= '3\.10'"
          if (-not $m) { Write-Error "torch pin for Python >= 3.10 not found in constraints.txt"; exit 1 }
          $torch = $m.Matches[0].Groups[1].Value
          python -m venv .venv-pack; Check "venv"
          .\.venv-pack\Scripts\python.exe -m pip install --upgrade pip; Check "pip upgrade"
          .\.venv-pack\Scripts\pip.exe install --index-url https://download.pytorch.org/whl/cpu "torch==$torch"; Check "CPU torch $torch"
          .\.venv-pack\Scripts\pip.exe install -r requirements.txt -c constraints.txt; Check "requirements"
          $v = .\.venv-pack\Scripts\python.exe -c "import torch; print(torch.__version__)"; Check "torch import"
          if ($v -notmatch '\+cpu$') { Write-Error "expected a +cpu torch build, got $v"; exit 1 }
          Write-Host "torch $v"

      - name: Assemble self-contained backend bundle
        shell: pwsh
        run: .\src-tauri\assemble-backend-win.ps1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"  # = rust-toolchain.toml (tests/test_toolchain_pins.py)

      # -- tauri-cli: download the official prebuilt BINARY, don't compile it --
      # `cargo install tauri-cli` compiles the CLI from source: 9m38s (macOS) and
      # 10m05s (Windows) on the v1.1.1 tag run (32446240446); still 3m20s / 9m14s
      # on v1.5.1 (38526072411).
      #
      # #345 tried to fix that with actions/cache. It never hit on a release, and
      # it CANNOT: v1.5.1 logged `Cache not found for input keys:
      # tauri-cli-macOS-2.11.4` while that exact key already existed, saved three
      # hours earlier by v1.5.0 -- under ref `refs/tags/v1.5.0`. A tag run can only
      # restore caches from its own tag or the default branch, so each release
      # wrote a cache only that same tag could ever read. Priming from main would
      # not hold either: releases are weeks apart, GitHub evicts entries unused
      # for 7 days, and this repo sits above its 10 GB cache quota (rust-cache
      # entries are ~300-450 MB each), so LRU eviction is constant.
      #
      # So: no cache. tauri-apps publishes the CLI as a release asset for each
      # target (the same files `cargo binstall` would fetch). Pinned by version
      # (TAURI_CLI_VERSION above) AND by sha256, so a bump has to touch the hash
      # here too -- a mismatch fails the step instead of shipping an unknown
      # bundler. Hashes = the `digest` GitHub reports for each asset:
      #   gh api repos/tauri-apps/tauri/releases/tags/tauri-cli-v<VER> \
      #     -q '.assets[]|[.name,.digest]|@tsv'
      # Not `cargo binstall`: its metadata for aarch64-apple-darwin says .tgz while
      # the asset is a .zip, so on this Mac leg it would fall back to compiling.
      - name: Install tauri-cli (prebuilt, sha256-pinned)
        shell: pwsh
        env:
          TAURI_CLI_TARGET: x86_64-pc-windows-msvc
          TAURI_CLI_SHA256: 0743e30a661a35d63339b24cf63828f97ba5389a1d7f13b368a542794dd0a3f3
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$env:TAURI_CLI_VERSION/cargo-tauri-$env:TAURI_CLI_TARGET.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'cargo-tauri.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($got -ne $env:TAURI_CLI_SHA256) { throw "cargo-tauri zip sha256 mismatch: got $got, want $env:TAURI_CLI_SHA256" }
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          $bin = Join-Path $cargoHome 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $out = Join-Path $env:RUNNER_TEMP 'cargo-tauri'
          Expand-Archive -Path $zip -DestinationPath $out -Force
          Copy-Item (Join-Path $out 'cargo-tauri.exe') (Join-Path $bin 'cargo-tauri.exe') -Force

      # Prove the binary runs and is the pinned version (a wrong-arch or wrong-
      # version file would otherwise surface much later as a confusing bundler
      # failure). It also prints the version into the log so a future "which
      # bundler built this installer?" is answerable from the run.
      - name: Verify tauri-cli
        shell: bash
        run: |
          v="$(cargo tauri --version | tr -d '\r')"
          echo "$v"
          [ "$v" = "tauri-cli ${TAURI_CLI_VERSION}" ] || { echo "::error::expected tauri-cli ${TAURI_CLI_VERSION}, got '$v'"; exit 1; }

      # -- Cache the bundler's packaging toolchain --------------------------
      # tauri-bundler downloads WiX and NSIS from GitHub *at build time*, so every
      # release stakes itself on two network round-trips. v0.12.1's Windows leg lost
      # that bet on its very first run: the .msi was already built and the NSIS step
      # died on `Downloading .../nsis-3.11.zip` -> `io: Peer disconnected`; a re-run
      # passed. That is a structural weakness, not flaky noise -- and a retry wrapper
      # would only re-roll the same dice, because it still downloads. This removes
      # the dice.
      #
      # WHERE: tauri-bundler resolves its tools dir as `dirs::cache_dir()/tauri`,
      # which is `%LOCALAPPDATA%\tauri` on Windows, then unpacks `NSIS/` and
      # `WixTools314/` inside it (~125 MB together).
      #
      # SCOPE CAVEAT -- this is what makes the difference between working and being
      # decorative: a tag run SAVES into the `refs/tags/<tag>` scope, and "workflow
      # runs cannot restore caches created for different tag names", so a cache
      # written by v0.12.2 is dead weight for v0.12.3. Restores DO fall back to the
      # default branch, so the entry that actually serves releases has to be written
      # by a run whose ref IS main -- i.e. the `workflow_dispatch` dry-run this
      # workflow already supports. Run that once on main to prime it; every tag
      # release restores from it afterwards.
      - name: Resolve the Tauri toolchain dir + cache key
        id: tauritools
        shell: bash
        run: |
          # Forward slashes: actions/cache globs its `path` input, and there a
          # backslash is an escape character rather than a separator.
          dir="${LOCALAPPDATA//\\//}/tauri"
          # Pre-create it so the post-job save cannot fail path validation on a
          # build that produced no bundle at all. The bundler only probes the
          # NSIS/ and WixTools314/ children, so an empty parent is invisible to it.
          mkdir -p "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

          # Key on the RESOLVED tauri-cli version rather than the "^2.0" range in
          # the step above: what lands in this dir is decided by the bundler
          # compiled into whichever 2.x `cargo install` just picked.
          ver="$(cargo tauri --version 2>/dev/null | tr -d '\r' | head -1 | awk '{print $NF}')"
          case "$ver" in
            2.*) ;;
            *)
              # Unparseable -> fall back to a key that CANNOT hit. Degrading to
              # today's behaviour (download every time) is the safe direction; a
              # constant fallback key would silently pin a stale toolchain forever.
              echo "::warning::could not read tauri-cli version (got '$ver'); toolchain cache disabled for this run"
              ver="unresolved-${GITHUB_RUN_ID}"
              ;;
          esac
          echo "cli=$ver" >> "$GITHUB_OUTPUT"
          echo "tauri-cli $ver -> caching $dir"

      # HIT  = a previous run on this scope already built with the same tauri-cli
      #        version. That is every release after the first, on the same 2.x.
      # MISS = tauri-cli resolved to a new 2.x, so the toolchain it wants may differ
      #        -> full re-download, then saved under the new key. Also a miss the
      #        first time ever, by definition.
      #
      # No `restore-keys` prefix, deliberately. WiX unpacks into a version-stamped
      # `WixTools314/` and self-invalidates by name, but NSIS unpacks into a plain
      # `NSIS/` and the bundler only checks that the directory EXISTS (plus a hash
      # check on its own nsis_tauri_utils.dll -- not on the NSIS 3.x base). A prefix
      # fallback would therefore hand a newer bundler an older base NSIS and it
      # would use it without a word. A miss costs exactly what today already costs,
      # so tight beats loose here.
      - name: Cache the Tauri packaging toolchain (WiX + NSIS)
        uses: actions/cache@v6
        with:
          path: ${{ steps.tauritools.outputs.dir }}
          key: tauri-toolchain-${{ runner.os }}-cli-${{ steps.tauritools.outputs.cli }}

      - name: Build app + installers
        working-directory: src-tauri
        run: cargo tauri build

      - name: Attach artifacts to the GitHub Release (tag only)
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: false
          # No `body:` here on purpose. action-gh-release REPLACES the release
          # body when given one, and this job runs after the macOS leg has
          # already written it — passing a Windows-only body would erase the
          # macOS notes. The combined text lives in the macOS job instead.

      - name: Upload dry-run artifact (workflow_dispatch)
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/upload-artifact@v7
        with:
          name: arkiv-dryrun-windows
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
