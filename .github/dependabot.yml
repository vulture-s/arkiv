# Dependency updates (Wave C). One PR per bump so every change carries the upstream
# changelog and a one-click rollback (revert the PR). The `docker` ecosystem also
# refreshes the @sha256 base-image digests pinned in Dockerfile + docker-compose.yml,
# so they don't rot. Policy: CONTRIBUTING.md § Dependency updates.
version: 2
updates:
  - package-ecosystem: "pip"          # requirements.txt + requirements-dev.txt (repo root)
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Floors in requirements*.txt say what the code NEEDS; pins live in constraints.txt.
    # The default strategy raised floors whenever a new release came out, and three of
    # those raises landed on versions that require Python >=3.10 — breaking the 3.9 floor
    # (see the marker splits in requirements.txt). Only touch a requirement when the new
    # version falls outside its range; pinned versions still get bumped as before.
    versioning-strategy: increase-if-necessary

  - package-ecosystem: "npm"          # frontend/package.json + package-lock.json
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"        # src-tauri/Cargo.toml + Cargo.lock
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"   # .github/workflows/*.yml action pins
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"       # Dockerfile FROM digests + docker-compose image digests
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The UI build stage tracks the Node LTS in .nvmrc (22). Digest refreshes and
      # minor/patch tags still come through; a major jump (e.g. #296, node 26) is a
      # deliberate move done together with .nvmrc, not a weekly bot PR.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
