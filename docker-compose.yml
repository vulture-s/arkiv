# arkiv — Docker Compose

services:
  arkiv:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./media.db:/app/media.db
      - ./chroma_db:/app/chroma_db
      - ./thumbnails:/app/thumbnails
      # Cross-library 精選集 (bins.py) persistence. Default storage is
      # ~/.arkiv-bins.json (=/root/.arkiv-bins.json inside the container),
      # which lives in the container's ephemeral layer — without this bind mount,
      # `docker compose down` / image rebuild / `--force-recreate` silently
      # wipes every bin the user has saved. Mount the *directory*, not the file:
      # bind-mounting a single file that doesn't exist on the host makes Docker
      # create a directory at the source path, which pollutes ./arkiv_data.
      # ARKIV_BINS_PATH pins the file inside the mount; bins.py already honours it.
      - ./arkiv_data/bins:/root/.arkiv-bins
      # Project registry (projects.py) persistence. Settings ⇒ Projects ⇒ Add Project
      # stores the list in ~/.arkiv-projects.json, which inside the container is
      # /root/.arkiv-projects.json — living in the container's ephemeral layer. Without
      # this bind mount, `docker compose down` / image rebuild / `--force-recreate`
      # silently wipes every registered project. Mount the *directory*, not the file:
      # bind-mounting a single file that doesn't exist on the host makes Docker
      # create a directory at the source path, which pollutes ./arkiv_data.
      # ARKIV_PROJECTS_REGISTRY pins the file inside the mount; projects.py already
      # honours it.
      - ./arkiv_data/projects:/root/.arkiv-projects
      # Upload landing zone (#422). `POST /api/ingest/upload` writes to
      # config.PROJECT_ROOT/"media-in" = /app/media-in and then queues a
      # background ingest of that directory. Without this mount the endpoint
      # fails two different ways depending on who the container runs as, and
      # BOTH were shipping:
      #   - as root (this image declares no USER): the write SUCCEEDS into the
      #     container's ephemeral layer, so every uploaded file is silently lost
      #     on `docker compose down` / rebuild and never appears on the host.
      #   - under a remapped non-root uid (Synology/QNAP default, and anyone
      #     setting `user:`): `PermissionError: [Errno 13] ... '/app/media-in'`,
      #     a 500 on an advertised feature in the canonical install path.
      # Measured 2026-09-05 on both uid 0 and uid 1000.
      - ./media-in:/app/media-in
      # The media library itself. Until now compose mounted arkiv's *derived*
      # data (db, vectors, thumbnails, bins, projects) but never the media it is
      # supposed to index — a containerised install had nothing to point at.
      # Override the host side with ARKIV_MEDIA_DIR (a NAS share, an external
      # drive) without editing this file:
      #     ARKIV_MEDIA_DIR=/volume1/video docker compose up -d
      - ${ARKIV_MEDIA_DIR:-./media}:/media
    environment:
      - ARKIV_DB_PATH=/app/media.db
      - ARKIV_CHROMA_PATH=/app/chroma_db
      - ARKIV_THUMBNAILS_DIR=/app/thumbnails
      - ARKIV_OLLAMA_URL=http://ollama:11434
      # Both of these must track the config.py defaults. Pinned here only so the
      # compose file is self-describing — if you change one, change config.py too,
      # or Docker silently diverges from every other install (it did, for months).
      - ARKIV_EMBED_MODEL=bge-m3
      - ARKIV_VISION_MODEL=qwen2.5vl:7b
      - ARKIV_WHISPER_MODEL=large-v3-turbo
      # 0.0.0.0 is correct INSIDE the container — the process must accept the
      # forwarded connection from the host. Reachability is fenced by the port
      # mapping above (host 8501 -> container 8501) on the default bridge network,
      # where the caller's peer IP is the bridge gateway (172.x), not loopback.
      # ⚠️ Do NOT run this with `--network host`: on host networking the external
      # caller's peer IP resolves to 127.0.0.1, and arkiv trusts loopback as the
      # local owner (ARKIV_TRUST_LOOPBACK, see auth.py) — that would hand every LAN
      # caller full admin with no token. Keep bridge + port mapping.
      - ARKIV_HOST=0.0.0.0
      - ARKIV_PORT=8501
      # See the ./arkiv_data/bins volume mount above; keep the path in sync.
      - ARKIV_BINS_PATH=/root/.arkiv-bins/bins.json
      # See the ./arkiv_data/projects volume mount above; keep the path in sync.
      - ARKIV_PROJECTS_REGISTRY=/root/.arkiv-projects/projects.json
      # Roots /api/ingest/scan and /api/ingest are allowed to walk (webguard
      # `_allowed_ingest_roots`, Codex J1 — without a bound, any caller could
      # inventory the whole filesystem). The defaults are PROJECT_ROOT plus
      # ~/Desktop, ~/Documents, ~/Movies, ~/Pictures and /Volumes/*, none of
      # which exist in this image, so /app was effectively the only root and a
      # library mounted anywhere else got rejected.
      #
      # 🔴 This variable REPLACES the default list, it does not extend it
      # (webguard returns early when it is set). /app must stay in it or the
      # upload flow above breaks: files land in /app/media-in and the follow-up
      # ingest of that directory would then be refused.
      - ARKIV_INGEST_ROOTS=/app:/media
      # Upload limits, surfaced here because they are otherwise invisible: the
      # values below are the code defaults (routers/ingest.py), repeated so a
      # deployer can see the knobs exist without reading the source.
      - ARKIV_UPLOAD_MAX_MB=4096
      - ARKIV_UPLOAD_MAX_CONCURRENT=3
      - ARKIV_UPLOAD_MAX_QUEUE_SEC=300
    depends_on:
      ollama:
        condition: service_healthy   # F6: wait for ollama READY, not just container-start
    restart: unless-stopped

  ollama:
    # Digest-pinned (Wave C): `:latest` on a frequently-pushed image was the worst drift
    # source. Tag kept for readability, digest authoritative; refresh via dependabot.
    image: ollama/ollama:latest@sha256:10c13eb515db310990527d36ca14a136da4bcc0fbf2bf3b15e9c1f111e9d3cd4
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # `ollama list` returns 0 only once the server is answering (readiness, not
      # just container-start). Does NOT wait for models to be pulled — that stays a
      # runtime/deploy step, not a compose gate.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # NVIDIA GPU passthrough (uncomment for CUDA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # macOS: GPU passthrough not needed (Ollama uses Metal natively on host)
    restart: unless-stopped

  # HTTP/SSE MCP for clients on other machines (#417). stdio MCP needs a local
  # process and a local DB, neither of which crosses a LAN, so an editor on
  # another Mac cannot reach the library at all without this.
  #
  # Same image, same read-only tools, different transport — it imports the tool
  # definitions from mcp_server rather than re-declaring them, so the two
  # transports cannot drift apart.
  arkiv-mcp:
    build: .
    command: ["python", "mcp_http_server.py"]
    ports:
      - "8502:8502"
    volumes:
      # Read-only: MCP exposes queries, never ingest or delete. The mount being
      # ro is a second lock behind that, not a substitute for it.
      - ./media.db:/app/media.db:ro
      - ./chroma_db:/app/chroma_db:ro
      - ./thumbnails:/app/thumbnails:ro
      - ${ARKIV_MEDIA_DIR:-./media}:/media:ro
    environment:
      - ARKIV_DB_PATH=/app/media.db
      - ARKIV_CHROMA_PATH=/app/chroma_db
      - ARKIV_THUMBNAILS_DIR=/app/thumbnails
      - ARKIV_OLLAMA_URL=http://ollama:11434
      - ARKIV_EMBED_MODEL=bge-m3
      # 0.0.0.0 INSIDE the container, fenced by the port mapping above — the same
      # split as ARKIV_HOST on the arkiv service. Running mcp_http_server.py
      # directly defaults to 127.0.0.1 instead, so publishing it stays a decision.
      - ARKIV_MCP_BIND=0.0.0.0
      - ARKIV_MCP_PORT=8502
      # 🔴 Set this to the address your MCP clients actually dial, or every LAN
      # request dies with 421 before arkiv sees it. The MCP SDK ships DNS
      # rebinding protection ON with a loopback-only allow-list; measured on
      # mcp 1.28.0, `Host: 192.168.1.50:8502` is refused while `127.0.0.1:8502`
      # passes. Values here are ADDED to the loopback defaults, never swapped
      # for them, so localhost keeps working while you debug. `*` turns the
      # host check off entirely — spelled out, so it cannot happen by accident.
      #   ARKIV_MCP_ALLOWED_HOSTS=192.168.1.50:8502,arkiv.local:8502
      - ARKIV_MCP_ALLOWED_HOSTS=${ARKIV_MCP_ALLOWED_HOSTS:-}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
