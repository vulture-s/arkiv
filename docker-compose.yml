# arkiv — Docker Compose

services:
  arkiv:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./media.db:/app/media.db
      - ./chroma_db:/app/chroma_db
      - ./thumbnails:/app/thumbnails
    environment:
      - ARKIV_DB_PATH=/app/media.db
      - ARKIV_CHROMA_PATH=/app/chroma_db
      - ARKIV_THUMBNAILS_DIR=/app/thumbnails
      - ARKIV_OLLAMA_URL=http://ollama:11434
      # Both of these must track the config.py defaults. Pinned here only so the
      # compose file is self-describing — if you change one, change config.py too,
      # or Docker silently diverges from every other install (it did, for months).
      - ARKIV_EMBED_MODEL=bge-m3
      - ARKIV_VISION_MODEL=qwen2.5vl:7b
      - ARKIV_WHISPER_MODEL=large-v3-turbo
      # 0.0.0.0 is correct INSIDE the container — the process must accept the
      # forwarded connection from the host. Reachability is fenced by the port
      # mapping above (host 8501 -> container 8501) on the default bridge network,
      # where the caller's peer IP is the bridge gateway (172.x), not loopback.
      # ⚠️ Do NOT run this with `--network host`: on host networking the external
      # caller's peer IP resolves to 127.0.0.1, and arkiv trusts loopback as the
      # local owner (ARKIV_TRUST_LOOPBACK, see auth.py) — that would hand every LAN
      # caller full admin with no token. Keep bridge + port mapping.
      - ARKIV_HOST=0.0.0.0
      - ARKIV_PORT=8501
    depends_on:
      ollama:
        condition: service_healthy   # F6: wait for ollama READY, not just container-start
    restart: unless-stopped

  ollama:
    # Digest-pinned (Wave C): `:latest` on a frequently-pushed image was the worst drift
    # source. Tag kept for readability, digest authoritative; refresh via dependabot.
    image: ollama/ollama:latest@sha256:10c13eb515db310990527d36ca14a136da4bcc0fbf2bf3b15e9c1f111e9d3cd4
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # `ollama list` returns 0 only once the server is answering (readiness, not
      # just container-start). Does NOT wait for models to be pulled — that stays a
      # runtime/deploy step, not a compose gate.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # NVIDIA GPU passthrough (uncomment for CUDA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # macOS: GPU passthrough not needed (Ollama uses Metal natively on host)
    restart: unless-stopped

volumes:
  ollama_data:
